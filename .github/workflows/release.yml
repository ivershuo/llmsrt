name: Release

# A release created with GITHUB_TOKEN does not trigger other workflows
# (recursion guard), so creating the release and publishing to PyPI must
# happen in this same workflow. Publishing is skipped when PyPI already
# has the version, which also lets interrupted runs self-heal on the
# next push.
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      pypi_missing: ${{ steps.pypi.outputs.missing }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        name: Read version from pyproject.toml
        run: echo "version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")" >> "$GITHUB_OUTPUT"
      - name: Create the GitHub release if it does not exist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${{ steps.version.outputs.version }}"
          if gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists"
          else
            gh release create "$tag" --target "$GITHUB_SHA" --generate-notes -R "$GITHUB_REPOSITORY"
          fi
      - id: pypi
        name: Check whether PyPI already has this version
        run: |
          if curl -sf "https://pypi.org/pypi/llmsrt/${{ steps.version.outputs.version }}/json" >/dev/null 2>&1; then
            echo "missing=false" >> "$GITHUB_OUTPUT"
          else
            echo "missing=true" >> "$GITHUB_OUTPUT"
  build:
    needs: release
    if: needs.release.outputs.pypi_missing == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build distributions
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/llmsrt
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
