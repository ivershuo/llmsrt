name: Create release

# Publishing to PyPI is triggered by release publication; keep releases in sync
# with the version in pyproject.toml so a version-bump push releases itself.
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Release the current pyproject version if not yet released
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          tag="v$version"
          if gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists; nothing to do"
            exit 0
          fi
          echo "Creating release $tag"
          gh release create "$tag" --target "$GITHUB_SHA" --generate-notes -R "$GITHUB_REPOSITORY"
